name: Weekly Publications Ingestion

# Weekly job: query Europe PMC (general ciliopathy terms + the project gene
# list), diff by PMID, summarize only new records with the LLM, upsert into the
# publications store, and commit the updated JSON back to the repo.

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab
    inputs:
      limit:
        description: "Cap the number of new records processed (blank = no cap)"
        required: false
        default: ""

permissions:
  contents: write

# Never let two ingestion runs race on the store / git push.
concurrency:
  group: publications-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ingestion
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python ingest_publications.py --limit "${{ github.event.inputs.limit }}"
          else
            python ingest_publications.py
          fi

      - name: Commit updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/publications.json public/data/publications.json
          if git diff --staged --quiet; then
            echo "No new publications to commit."
          else
            git commit -m "chore(publications): weekly ingestion $(date -u +%Y-%m-%d)"
            git push
          fi
